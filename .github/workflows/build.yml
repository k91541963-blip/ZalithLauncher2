name: Build APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
      arches:
        required: false
        type: string
        default: '["all","arm","arm64","x86","x86_64"]'
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.arches || '["all","arm","arm64","x86","x86_64"]') }}
      fail-fast: false

    env:
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Run unit tests
        id: tests
        if: inputs.variant == 'Debug'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew ZalithLauncher:testDebugUnitTest --tests "com.movtery.zalithlauncher.game.performance.*" --tests "com.movtery.zalithlauncher.game.diagnostics.*" --tests "com.movtery.zalithlauncher.game.version.mod.dependency.*" -Darch=all 2>&1 | tee gradle-test.log

      - name: Report unit test errors
        if: inputs.variant == 'Debug' && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          grep -E "^e: |error:|Execution failed|Caused by:|FAILED" gradle-test.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Build APK for ${{ matrix.arch }}
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }} -Darch=${{ matrix.arch }} 2>&1 | tee gradle-build.log

      - name: Report build errors
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          grep -E "^e: |error:|Execution failed|Caused by:" gradle-build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Upload Release APK for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk

      - name: Prepare release asset
        if: inputs.variant == 'Debug' && matrix.arch == 'arm64'
        shell: bash
        run: |
          mkdir -p release-assets
          cp ZalithLauncher/build/outputs/apk/debug/*.apk release-assets/NovaLauncher-arm64-debug.apk

      - name: Publish APK to release
        if: inputs.variant == 'Debug' && matrix.arch == 'arm64'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Nova Launcher (arm64 debug)
          body: |
            Debug APK built from commit ${{ github.sha }}.
            Direct download: NovaLauncher-arm64-debug.apk
          files: release-assets/NovaLauncher-arm64-debug.apk
          prerelease: true
          make_latest: false
